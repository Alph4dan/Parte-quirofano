    // Utilidades de Cookies para mantener la sesión de Administrador activa
    const setAdminAuthCookie = (days = 30) => {
      try {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${ADMIN_COOKIE_NAME}=authenticated_v1; expires=${expires}; path=/; SameSite=Lax`;
        localStorage.setItem(ADMIN_COOKIE_NAME, 'authenticated_v1');
      } catch (e) {}
    };

    const getAdminAuthCookie = () => {
      try {
        const hasCookie = document.cookie
          .split('; ')
          .some((row) => row.startsWith(`${ADMIN_COOKIE_NAME}=authenticated_v1`));
        const hasLocal = localStorage.getItem(ADMIN_COOKIE_NAME) === 'authenticated_v1';
        return hasCookie || hasLocal;
      } catch (e) {
        return false;
      }
    };

    const clearAdminAuthCookie = () => {
      try {
        document.cookie = `${ADMIN_COOKIE_NAME}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;

    const detectWeekdayFromText = (text, fallbackKey = 'JUEVES') => {
      const upper = String(text || '')
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
      for (const d of WEEK_DAYS) {
        if (upper.includes(d.key)) return d.key;
      }
      return fallbackKey;
    };

        script.async = true;
        script.onload = () => resolve(window.XLSX || null);
        script.onerror = () => resolve(null);
        document.head.appendChild(script);

    const extractIndividualDoctorsFromText = (rawText) => {
      if (!rawText) return [];
      const parts = String(rawText)
        .split('/')
        .map((p) => p.trim())
        .filter(Boolean);

      const doctors = [];
      parts.forEach((part) => {
        const cleanName = part.replace(/\s*\(.*?\)/g, '').replace(/\s+/g, ' ').trim();
        if (
          cleanName &&
          (/^Dr\.?\s/i.test(cleanName) || /^Dra\.?\s/i.test(cleanName))
        ) {
          doctors.push(cleanName);
        }
      });
      return doctors;
    };

    const formatDateTime = (dateObj = new Date()) => {
      const pad = (n) => String(n).padStart(2, '0');
      const day = pad(dateObj.getDate());
      const month = pad(dateObj.getMonth() + 1);
      const year = dateObj.getFullYear();
      const hours = pad(dateObj.getHours());
      const minutes = pad(dateObj.getMinutes());
      const seconds = pad(dateObj.getSeconds());
      return `${day}/${month}/${year} - ${hours}:${minutes}:${seconds}`;
    };

    const formatShortTime = (dateObj = new Date()) => {
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
    };

          for (let r = 0; r < Math.min(5, matrix.length); r++) {
            for (let c = 0; c < (matrix[r]?.length || 0); c++) {
              const cellText = String(matrix[r][c] || '').trim();
              if (cellText.length > 5) {

        }

        const detectedDayKey =
          forcedDayKey !== 'AUTO'
            ? forcedDayKey

        const extractedWorkersSet = new Set(INITIAL_WORKERS_FROM_EXCEL);
        matrix.forEach((row) => {
          [1, 3, 7].forEach((colIdx) => {
            const val = String(row?.[colIdx] || '').trim();
            if (val) {
              const individuals = extractIndividualDoctorsFromText(val);
              individuals.forEach((docName) => extractedWorkersSet.add(docName));

                const rawCellVal = String(excelRow[item.col]).trim();
                const finalWorker = rawCellVal !== '' ? rawCellVal : 'SIN ASIGNAR';
                updatedCellsCount++;
                return {
                  ...item,
                  worker: finalWorker,
                  modifiedAt: null,
                  previousWorker: null

          a.localeCompare(b, 'es')
        );

          fileNameLoaded: sourceFileName,
          lastUpdated: formattedNow,

        const xlsxLib = await loadSheetJSLibrary();
        const nextWeekly = { ...weeklySchedules };
        const newLogs = [];
        let lastProcessedDay = activeDayKey;

        for (const file of files) {
          try {
            const buffer = await file.arrayBuffer();
            let matrix = [];

            if (xlsxLib) {
              const data = new Uint8Array(buffer);
              const workbook = xlsxLib.read(data, { type: 'array' });

              if (workbook.SheetNames.length > 1 && forcedDay === 'AUTO') {
                workbook.SheetNames.forEach((sheetName) => {
                  const ws = workbook.Sheets[sheetName];
                  const sheetMatrix = xlsxLib.utils.sheet_to_json(ws, { header: 1, defval: '' });
                  if (sheetMatrix && sheetMatrix.length > 5) {
                    const parsed = parseMatrixIntoScheduleData(
                      sheetMatrix,
                      `${file.name} [${sheetName}]`,
                      detectWeekdayFromText(sheetName, 'AUTO')
                    );
                    nextWeekly[parsed.dayKey] = parsed;
                    lastProcessedDay = parsed.dayKey;
                    newLogs.push({
                      id: `excel-${Date.now()}-${Math.random()}`,
                      time: parsed.lastUpdated,
                      shortTime: parsed.shortTime,
                      user: 'admin',
                      type: 'excel',
                      position: `Carga Semanal (${parsed.dayKey})`,
                      previousValue: '-',
                      newValue: `${file.name} [${sheetName}] → ${parsed.scheduleDate}`
                    });
                  }
                });
                continue;
              }

              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              matrix = xlsxLib.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
            } else {
              const text = new TextDecoder('utf-8').decode(buffer);
              matrix = text.split(/\r?\n/).map((line) => line.split(/[;,|\t]/));
            }

            if (!matrix || matrix.length === 0) continue;

            const parsed = parseMatrixIntoScheduleData(matrix, file.name, forcedDay);
            nextWeekly[parsed.dayKey] = parsed;
            lastProcessedDay = parsed.dayKey;

            newLogs.push({

              shortTime: parsed.shortTime,
              user: 'admin',
              type: 'excel',
              position: `Carga Excel (${parsed.dayKey})`,
              previousValue: scheduleDate,
              newValue: `${file.name} (${parsed.scheduleDate} - ${parsed.updatedCellsCount} puestos)`
            });
          } catch (err) {
            showToast(`Error al leer ${file.name}. Verifique que sea un .xlsx válido.`, 'error');
          }

      const duplicatesAnalysis = useMemo(() => {
        const mapByDoctor = new Map();

        sections.forEach((sec) => {
          sec.columns.forEach((col) => {
            col.items.forEach((item) => {
              const doctorsInCell = extractIndividualDoctorsFromText(item.worker);
              doctorsInCell.forEach((docName) => {
                const codeUpper = String(item.code).toUpperCase();
                const labelUpper = String(item.label).toUpperCase();
                const isIncidencia = sec.id === 'bloque-incidencias';
                const isLibra = col.id === 'guardia-libra';
                const isGuardia = col.id === 'guardia-act';
                const isTarde =
                  codeUpper.startsWith('T') ||
                  labelUpper.includes('TARDE') ||
                  item.worker.toLowerCase().includes('tarde');

                let shiftCategory = 'MAÑANA / CONTINUO';
                if (isIncidencia) shiftCategory = 'BAJA / VACACIONES / DLD / REDUCCIÓN';
                else if (isLibra) shiftCategory = 'LIBRA GUARDIA';
                else if (isGuardia) shiftCategory = 'GUARDIA';
                else if (isTarde) shiftCategory = 'TARDE';

                if (!mapByDoctor.has(docName)) {
                  mapByDoctor.set(docName, []);
                }
                mapByDoctor.get(docName).push({
                  cellId: item.id,
                  sectionId: sec.id,
                  sectionTitle: sec.title,
                  columnSubtitle: col.subtitle,
                  code: item.code,
                  label: item.label,
                  rawCellText: item.worker,
                  shiftCategory,
                  isIncidencia,
                  isLibra,
                  isGuardia,
                  isTarde
                });
              });
            });
          });
        });

        const duplicatedDoctors = [];
        const duplicatedCellIds = new Set();
        const cellDuplicateInfoMap = new Map();

        mapByDoctor.forEach((occurrences, docName) => {
          if (occurrences.length > 1) {
            const hasIncidenciaOrLibra = occurrences.some((o) => o.isIncidencia || o.isLibra);
            const morningWorkingCount = occurrences.filter(
              (o) => !o.isIncidencia && !o.isLibra && !o.isGuardia && !o.isTarde
            ).length;
            const afternoonWorkingCount = occurrences.filter((o) => o.isTarde).length;

            let severity = 'warning';
            let reason = 'Asignado en múltiples puestos / turnos en el mismo día';

            if (hasIncidenciaOrLibra && occurrences.length > 1) {
              severity = 'critical';
              reason = 'Incompatibilidad: Figura en Bajas/Vacaciones/DLD/Libra y asignado a otro puesto';
            } else if (morningWorkingCount > 1) {
              severity = 'critical';
              reason = `Solapamiento directo: Asignado en ${morningWorkingCount} puestos simultáneos de mañana`;
            } else if (afternoonWorkingCount > 1) {
              severity = 'critical';
              reason = `Solapamiento directo: Asignado en ${afternoonWorkingCount} puestos simultáneos de tarde`;
            }

            duplicatedDoctors.push({
              doctor: docName,
              count: occurrences.length,
              severity,
              reason,
              occurrences
            });

            occurrences.forEach((occ) => {
              duplicatedCellIds.add(occ.cellId);
              const prevList = cellDuplicateInfoMap.get(occ.cellId) || [];
              prevList.push({
                doctor: docName,
                count: occurrences.length,
                severity,
                reason,
                otherLocations: occurrences
                  .filter((o) => o.cellId !== occ.cellId)
                  .map((o) => `${o.code} (${o.label})`)
              });
              cellDuplicateInfoMap.set(occ.cellId, prevList);
            });
          }
        });

        duplicatedDoctors.sort((a, b) => {
          if (a.severity !== b.severity) return a.severity === 'critical' ? -1 : 1;
          return b.count - a.count;
        });

        return {
          duplicatedDoctors,
          duplicatedCellIds,
          cellDuplicateInfoMap,
          criticalCount: duplicatedDoctors.filter((d) => d.severity === 'critical').length

        const parts = clean.split(/[\s.]+/).filter(Boolean);

            bodyBg: 'bg-amber-50/50',

                    <History className="w-5 h-5 text-emerald-400" />
                    <div>
                      <h3 className="text-base font-extrabold">
                        Registro de Actualizaciones del Parte ({scheduleDate})
                      </h3>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowHistoryModal(false)}
                    className="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white cursor-pointer"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-5 divide-y divide-slate-200">
                  {changeLog.map((entry, idx) => (
                    <div key={entry.id} className="py-3 first:pt-0 last:pb-0 flex items-start gap-3">
                      <div
                        className={`px-2.5 py-1 rounded-lg text-xs font-mono font-bold shrink-0 ${
                          idx === 0
                            ? 'bg-amber-500 text-slate-950'
                            : 'bg-slate-100 text-slate-700'
                        }`}
                      >
                        {entry.time}
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-2">
                          <span className="text-xs sm:text-sm font-bold text-slate-900">
                            {entry.position}
                          </span>
                          {idx === 0 && (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-100 text-emerald-800">
                              MÁS RECIENTE
                            </span>
                          )}
                        </div>
                        <p className="text-xs text-slate-600 mt-0.5">
                          Anterior: <span className="line-through text-slate-400">{entry.previousValue}</span>{' '}
                          → Nuevo: <strong className="text-emerald-700">{entry.newValue}</strong>
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL GUÍA HOSTING Y ONEDRIVE */}
          {showCloudArchitectureModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-3xl w-full overflow-hidden flex flex-col max-h-[88vh]">
                <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <Cloud className="w-5 h-5 text-sky-400" />
                    <h3 className="text-base font-extrabold">
                      Guía de Despliegue Gratuito en Vercel y OneDrive
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowCloudArchitectureModal(false)}
                    className="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white cursor-pointer"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-4 text-slate-700 text-xs sm:text-sm">
                  <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2">
                    <div className="flex items-center gap-2 text-emerald-900 font-extrabold text-sm">
                      <Globe className="w-4 h-4 text-emerald-600" />
                      <span>Cómo subir este archivo index.html a Vercel gratis</span>
                    </div>
                    <ol className="list-decimal pl-5 space-y-1.5 text-xs text-slate-700">
                      <li>Descarga este archivo <strong>index.html</strong> en una carpeta nueva en tu ordenador.</li>
                      <li>Sube esa carpeta a un repositorio gratuito en <strong>GitHub.com</strong>.</li>
                      <li>Entra en <strong>Vercel.com</strong> con tu cuenta de GitHub, pulsa <em>Add New → Project</em>, importa tu repositorio y dale a <strong>Deploy</strong>.</li>
                      <li>En 20 segundos tendrás tu web gratuita terminada en <code>.vercel.app</code>.</li>
                    </ol>
                  </div>
                </div>

                <div className="bg-slate-50 px-6 py-3 border-t border-slate-200 flex justify-end">
                  <button
                    onClick={() => setShowCloudArchitectureModal(false)}
                    className="px-5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer"
                  >
                    Entendido
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
